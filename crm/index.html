<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Devo CRM</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--p1:#0b0b0c;--p2:#131315;--p3:#1b1b1e;--line:#ffffff14;--line2:#ffffff26;--tx:#f5f5f7;--mu:#a1a1a6;--mu2:#6e6e73;--r:18px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
.h{font-family:Archivo,Inter,sans-serif;font-weight:800;font-stretch:112%;letter-spacing:-.02em;line-height:1.02}
.hide{display:none!important}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.authbox{width:100%;max-width:380px;text-align:center}
.authbox svg{width:84px;height:84px;margin-bottom:26px}
.authbox h1{font-size:34px;margin-bottom:10px}
.authbox p{color:var(--mu);margin-bottom:26px}
.in{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:0;transition:border-color .2s,background .2s}
.in:focus{border-color:#ffffff66;background:var(--p3)}
.in::placeholder{color:var(--mu2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--tx);color:#000;font-weight:600;border-radius:999px;padding:12px 22px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--p3);color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--line2)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.full{width:100%;margin-top:12px}
.err{color:#ff9a9a;font-size:13px;min-height:20px;margin-top:10px}
/* shell */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brand svg{width:40px;height:40px}
.brand b{display:block;font-size:13px;letter-spacing:.14em}
.brand span{font-size:12px;color:var(--mu2)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mu);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--p2);color:var(--tx)}
.nav.on{background:var(--p3);color:var(--tx)}
.nav svg{width:19px;height:19px;flex:none}
.nav .ct{margin-left:auto;font-size:12px;background:var(--tx);color:#000;border-radius:99px;padding:1px 8px;font-weight:600}
.sp{flex:1}
main{min-width:0;padding:34px 36px 80px;max-width:1500px}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap}
.top h1{font-size:clamp(34px,5vw,56px)}
.top .sub{color:var(--mu);margin-top:8px}
.search{position:relative;width:260px;max-width:100%}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;color:var(--mu2)}
.search .in{padding:11px 14px 11px 38px;border-radius:999px}
/* cards & grids */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px}
.tile{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--line2);transform:translateY(-2px)}
.tile .n{font-size:44px}
.tile .l{color:var(--mu);font-size:13px;margin-top:6px}
.sec{margin-bottom:34px}
.sec>h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu2);font-weight:600;margin-bottom:14px;font-family:Inter}
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:14px;background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s;text-align:left;width:100%}
.row:hover{border-color:var(--line2);background:var(--p2)}
.av{width:40px;height:40px;border-radius:50%;background:var(--p3);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;flex:none;font-size:14px}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow span{display:block;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border:1px solid var(--line2);color:var(--mu);border-radius:99px;padding:3px 9px;white-space:nowrap}
.chip.w{background:var(--tx);color:#000;border-color:var(--tx)}
.empty{color:var(--mu2);padding:22px;border:1px dashed var(--line2);border-radius:16px;text-align:center}
.bar{height:4px;background:var(--p3);border-radius:9px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--tx);border-radius:9px;transition:width .4s}
/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x proximity}
.col{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:300px;scroll-snap-align:start;transition:border-color .2s}
.col.over{border-color:#ffffff80}
.col h3{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:12px;font-weight:600}
.card{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;cursor:grab;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.drag{opacity:.4}
.card b{font-weight:600;display:block}
.card .m{color:var(--mu);font-size:12.5px;margin:3px 0 10px}
.card .f{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu)}
/* waiting */
.wcard{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.wcard header{display:flex;align-items:center;gap:14px;margin-bottom:12px;cursor:pointer}
.wi{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.wi .d{margin-left:auto;font-size:12px;color:var(--mu)}
.wi .d.od{color:#000;background:var(--tx);border-radius:99px;padding:1px 9px;font-weight:600}
/* calendar */
.calwrap{display:grid;grid-template-columns:1fr 320px;gap:20px}
.cal{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calh .h{font-size:26px}
.ib{width:36px;height:36px;border-radius:50%;background:var(--p3);display:grid;place-items:center;border:1px solid var(--line)}
.ib:hover{border-color:var(--line2)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--mu2);text-align:center;padding:6px 0;letter-spacing:.1em}
.day{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;color:var(--mu);overflow:hidden}
.day.td{border-color:#ffffff80}
.day.off{opacity:.35}
.ev{display:block;width:100%;text-align:left;background:var(--tx);color:#000;border-radius:6px;padding:2px 6px;margin-top:4px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.q{background:var(--p3);color:var(--tx);border:1px solid var(--line2)}
.ev.dbl{outline:2px solid #fff;outline-offset:1px}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);padding:10px 12px;font-weight:600}
.tbl td{padding:13px 12px;border-top:1px solid var(--line)}
.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:var(--p1)}
.tw{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line2);color:var(--mu);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500}
.pill.on{background:var(--tx);color:#000;border-color:var(--tx)}
/* drawer */
#scrim{position:fixed;inset:0;background:#000a;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--p1);border-left:1px solid var(--line2);transform:translateX(104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:50;overflow-y:auto;padding:26px 26px 60px}
#drawer.on{transform:none}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.dh .nm{font-size:30px;word-break:break-word;background:none;border:0;outline:0;width:100%}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.fields label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);margin-bottom:5px;font-weight:600}
.fields .full{grid-column:1/-1}
.fields .in{padding:11px 13px;font-size:14px}
textarea.in{resize:vertical;min-height:80px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.dsec{margin-bottom:28px}
.dsec>h3{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:all .15s}
.box.on{background:var(--tx);border-color:var(--tx)}
.box svg{width:13px;opacity:0}.box.on svg{opacity:1}
.chk .t{flex:1;min-width:0}
.chk.dn .t{color:var(--mu2);text-decoration:line-through}
.chk input[type=date]{background:transparent;border:0;color:var(--mu);font-size:12px;width:116px;outline:0}
.chk .x{color:var(--mu2);width:26px;height:26px;border-radius:8px}.chk .x:hover{background:var(--p3);color:var(--tx)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .in{padding:10px 14px;font-size:14px}
.note{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.note small{display:block;color:var(--mu2);font-size:12px;margin-top:3px}
.note.s{color:var(--mu)}
.nb{white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--tx);color:#000;border-radius:99px;padding:11px 20px;font-weight:600;opacity:0;transition:all .3s;z-index:90;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.tabbar{display:none}
@media(max-width:900px){
 #app{grid-template-columns:1fr}
 aside{display:none}
 main{padding:22px 16px 110px}
 .tiles{grid-template-columns:1fr 1fr}
 .calwrap{grid-template-columns:1fr}
 .day{min-height:64px;padding:4px}.ev{font-size:10px;padding:1px 4px}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#000d;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
 .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mu2);padding:7px 0;border-radius:12px}
 .tabbar button.on{color:var(--tx)}
 .tabbar svg{width:22px;height:22px}
 .fields{grid-template-columns:1fr}
 #drawer{padding:20px 18px 70px}
 .search{width:100%}
 .tbl .hm{display:none}
}

/* planner */
#planner{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#planner.on{transform:none}
.pl{max-width:860px;margin:0 auto;padding:0 22px 120px}
.plbar{position:sticky;top:0;z-index:6;background:#000e;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:0 -22px 18px;padding:14px 22px;display:flex;align-items:center;gap:14px;height:68px}
.plbar .grow b{font-size:17px;display:block}
.plsave{font-size:12px;color:var(--mu2);min-width:56px;text-align:right}
.planlink{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;transition:border-color .2s}
.planlink:hover{border-color:var(--line2)}
.clink{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:26px}
.clink .t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clink .t b{font-size:14px}.clink small{display:block;color:var(--mu);font-size:12.5px;margin-top:3px}
.clink .a{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.live{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:12px;color:var(--mu2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mu2)}
.live.hot{color:#30d158}.live.hot i{background:#30d158;animation:lv 1.2s infinite}
@keyframes lv{50%{opacity:.3}}
.mnew{display:none}
@media(max-width:900px){.mnew{display:inline-flex}.pl{padding:0 16px 120px}.plbar{margin:0 -16px 14px;padding:12px 16px}}
@media print{
 body>*:not(#planner):not(#sheet){display:none!important}
 #planner:not(.on),#sheet:not(.on){display:none!important}
 #sheet{position:static!important;transform:none!important;overflow:visible!important;background:#fff!important}
 #sheet *{color:#000!important;background:none!important;border-color:#bbb!important}
 .shbar,.noprint{display:none!important}
 .sh{break-inside:avoid}
 html,body{background:#fff!important;color:#000!important}
 #planner{position:static!important;transform:none!important;overflow:visible!important;background:#fff!important;color:#000!important}
 .plbar,.plsave{display:none!important}
 .pl{max-width:none;padding:0}
}

#msgm{position:fixed;inset:0;background:#000a;z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#msgm.on{display:flex}
.mbox{background:var(--p1);border:1px solid var(--line2);border-radius:22px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:17px}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mbox textarea{min-height:200px;font-size:15px;line-height:1.5;resize:vertical}
.ma{display:flex;gap:8px;margin-top:12px}.mn{color:var(--mu2);font-size:12.5px;margin-top:8px}
.btn[disabled]{opacity:.4;pointer-events:none}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:75;overflow-y:auto;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
.shi{max-width:760px;margin:0 auto;padding:0 22px 120px}
.shbar{position:sticky;top:0;z-index:3;background:#000e;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:0 -22px 22px;padding:14px 22px;display:flex;align-items:center;gap:14px;height:68px}
.shn{font-size:clamp(34px,7vw,56px);margin-bottom:10px}
.shm{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}.shm i{font-style:normal;border:1px solid var(--line2);border-radius:99px;padding:5px 13px;font-size:13.5px;color:var(--mu)}
.sh{background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:6px 20px 12px;margin-bottom:14px}
.sh h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu2);font-weight:600;padding:14px 0 6px}
.sr{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:7px 0;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.sr:first-of-type{border-top:0}.sr>span{color:var(--mu);font-size:14px}
.sr.tl>span{font-family:Archivo,Inter,sans-serif;font-weight:800;color:var(--tx);font-size:16px}.sd{color:var(--mu);font-size:14px;margin-top:2px}
.gr{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}.gr input{width:20px;height:20px;accent-color:#fff}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:18px 18px 12px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.bv{width:100%;max-width:46px;background:var(--tx);border-radius:8px 8px 3px 3px;min-height:3px;position:relative}.bv em{position:absolute;top:-18px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;color:var(--tx)}
@media(max-width:700px){.sr{grid-template-columns:1fr;gap:2px}.shi{padding:0 16px 120px}.shbar{margin:0 -16px 18px;padding:12px 16px}.tiles{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="auth" class="hide">
 <div class="authbox">
  <svg viewBox="0 0 400 400" aria-label="Devo Productions"><circle cx="200" cy="200" r="180" fill="#000"/><circle cx="200" cy="200" r="162" fill="none" stroke="#fff" stroke-width="3"/><g fill="#fff"><rect x="150" y="150" width="9" height="40" rx="4.5"/><rect x="168" y="132" width="9" height="76" rx="4.5"/><rect x="186" y="116" width="9" height="108" rx="4.5"/><rect x="204" y="132" width="9" height="76" rx="4.5"/><rect x="222" y="150" width="9" height="40" rx="4.5"/></g><text x="200" y="262" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" letter-spacing="3" fill="#fff">DEVO</text><text x="200" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="9" fill="#fff">PRODUCTIONS</text></svg>
  <h1 class="h" id="atitle">Sign in</h1>
  <p id="asub">Enter your passcode to open the CRM</p>
  <form id="aform">
   <input class="in" id="apass" type="password" autocomplete="current-password" placeholder="Passcode" required>
   <input class="in hide" id="apass2" type="password" autocomplete="new-password" placeholder="Confirm passcode" style="margin-top:10px">
   <button class="btn full" id="abtn">Continue</button>
   <div class="err" id="aerr"></div>
  </form>
 </div>
</div>

<div id="app" class="hide">
 <aside>
  <div class="brand"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="180" fill="#000"/><circle cx="200" cy="200" r="162" fill="none" stroke="#fff" stroke-width="6"/><g fill="#fff"><rect x="150" y="150" width="14" height="60" rx="7"/><rect x="172" y="120" width="14" height="120" rx="7"/><rect x="194" y="90" width="14" height="180" rx="7"/><rect x="216" y="120" width="14" height="120" rx="7"/><rect x="238" y="150" width="14" height="60" rx="7"/></g></svg><div><b>DEVO</b><span>CRM</span></div></div>
  <button class="btn sm" id="newbtn" style="margin:0 6px 12px">+ New customer</button>
  <div id="nav"></div>
  <div class="sp"></div>
  <button class="nav" id="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</button>
 </aside>
 <main id="main"></main>
</div>
<nav class="tabbar hide" id="tabbar"></nav>

<div id="planner" aria-hidden="true"></div>
<div id="scrim"></div>
<div id="drawer" aria-hidden="true"></div>
<div id="toast"></div>

<script src="/plan/form.js"></script>
<script>
(function(){
'use strict';
var ST=['new','contacted','quoted','booked','planning','done','lost'];
var STL={new:'New',contacted:'Contacted',quoted:'Quoted',booked:'Booked',planning:'Planning',done:'Done',lost:'Lost'};
var ACTIVE=['contacted','quoted','booked','planning'];
var SERV=['Wedding','Party / Event DJ','Church Sound Consulting','Sound Training','Something else'];

/* ---------- api ---------- */
function api(method,path,body){
 return fetch('/api/'+path,{method:method,credentials:'same-origin',headers:method==='GET'?{}:{'Content-Type':'application/json'},body:method==='GET'?undefined:JSON.stringify(body||{})}).then(function(r){
  return r.json().catch(function(){return {}}).then(function(j){
   if(r.status===401&&path.indexOf('auth/')!==0){showAuth(false);throw new Error('auth')}
   if(!r.ok)throw new Error(j.error||'Something went wrong');return j;});
 });
}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2200)}
function load(){return api('GET','data').then(function(j){D=j;render();if(openId)drawerRefresh()})}

/* ---------- dates ---------- */
function pd(s){if(!s)return null;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function days(s){var d=pd(s);return d?Math.round((d-today())/864e5):null}
function fmt(s,long){var d=pd(s);if(!d)return '';return d.toLocaleDateString('en-US',long?{weekday:'short',month:'short',day:'numeric',year:'numeric'}:{month:'short',day:'numeric'})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ago(s){var m=(Date.now()-new Date(s))/6e4;if(m<1)return 'just now';if(m<60)return Math.floor(m)+'m ago';if(m<1440)return Math.floor(m/60)+'h ago';var d=Math.floor(m/1440);return d<30?d+'d ago':fmt(s.slice(0,10))}
function rel(s){var d=days(s);if(d===null)return '';if(d===0)return 'Today';if(d===1)return 'Tomorrow';if(d<0)return Math.abs(d)+'d overdue';return 'in '+d+'d'}

/* ---------- data helpers ---------- */
function byId(id){return D.contacts.filter(function(c){return c.id===id})[0]}
function needsOf(id){return D.needs.filter(function(n){return n.contact_id===id})}
function openNeeds(id){return needsOf(id).filter(function(n){return !n.done})}
function prog(id){var n=needsOf(id);var d=n.filter(function(x){return x.done}).length;return {d:d,t:n.length,p:n.length?Math.round(d/n.length*100):0}}
function ini(n){return (n||'?').split(/\s+/).slice(0,2).map(function(x){return x[0]}).join('').toUpperCase()}
function match(c){if(!q)return true;var s=(c.name+' '+(c.email||'')+' '+(c.phone||'')+' '+(c.venue||'')+' '+(c.service||'')).toLowerCase();return s.indexOf(q.toLowerCase())>-1}
function dblDates(){var m={};D.contacts.forEach(function(c){if(c.event_date&&(c.stage==='booked'||c.stage==='planning')){(m[c.event_date]=m[c.event_date]||[]).push(c.id)}});var o={};Object.keys(m).forEach(function(k){if(m[k].length>1)o[k]=m[k]});return o}

/* ---------- shell ---------- */
function showAuth(setup){
 $('#app').classList.add('hide');$('#tabbar').classList.add('hide');$('#auth').classList.remove('hide');closeDrawer();
 $('#atitle').textContent=setup?'Set a passcode':'Sign in';
 $('#asub').textContent=setup?'Choose a passcode of at least 8 characters. You will use it to open the CRM':'Enter your passcode to open the CRM';
 $('#apass2').classList.toggle('hide',!setup);$('#apass2').required=setup;$('#aform').dataset.setup=setup?'1':'';
 $('#apass').autocomplete=setup?'new-password':'current-password';$('#apass').value='';$('#apass2').value='';$('#aerr').textContent='';
 setTimeout(function(){$('#apass').focus()},50);
}
$('#aform').addEventListener('submit',function(e){
 e.preventDefault();var setup=this.dataset.setup==='1',p=$('#apass').value;$('#aerr').textContent='';
 if(setup&&p!==$('#apass2').value){$('#aerr').textContent='The passcodes do not match.';return}
 $('#abtn').disabled=true;
 api('POST',setup?'auth/setup':'auth/login',{passcode:p}).then(start).catch(function(er){$('#aerr').textContent=er.message}).then(function(){$('#abtn').disabled=false});
});
function start(){
 $('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#tabbar').classList.remove('hide');
 return load();
}
$('#logout').addEventListener('click',function(){api('POST','auth/logout',{}).then(function(){showAuth(false)})});
$('#newbtn').addEventListener('click',function(){newCustomer()});
function go(v){view=v;if(v!=='all')filt='all';render();window.scrollTo(0,0)}
function counts(){return {new:D.contacts.filter(function(c){return c.stage==='new'}).length}}

 var c=counts();
 $('#nav').innerHTML=NAV.map(function(n){return '<button class="nav'+(view===n[0]?' on':'')+'" data-v="'+n[0]+'">'+ICO[n[0]]+n[1]+(n[0]==='pipe'&&c.new?'<span class="ct">'+c.new+'</span>':'')+'</button>'}).join('');

function head(title,sub,extra){

}
function searchBox(){return '<div class="search">'+ICO.s+'<input class="in" id="q" placeholder="Search customers" value="'+esc(q)+'"></div>'}

 return '<button class="row" data-open="'+c.id+'"><div class="av">'+esc(ini(c.name))+'</div><div class="grow"><b>'+esc(c.name)+'</b><span>'+esc([c.service,c.event_date?fmt(c.event_date):'',c.venue].filter(Boolean).join(' · ')||c.email||'')+'</span></div>'+(extra||'')+(p.t?'<div style="width:70px"><div class="bar"><i style="width:'+p.p+'%"></i></div></div>':'')+'<span class="chip">'+STL[c.stage]+'</span></button>';

function vToday(){

 var nw=D.contacts.filter(function(c){return c.stage==='new'});
 var act=D.contacts.filter(function(c){return ACTIVE.indexOf(c.stage)>-1});
 var waiting=act.filter(function(c){return openNeeds(c.id).length});
 var up=D.contacts.filter(function(c){var d=days(c.event_date);return d!==null&&d>=0&&d<=30&&(c.stage==='booked'||c.stage==='planning')}).sort(function(a,b){return a.event_date<b.event_date?-1:1});
 var booked=D.contacts.filter(function(c){return (c.stage==='booked'||c.stage==='planning'||c.stage==='done')&&c.event_date&&c.event_date.slice(0,4)===String(new Date().getFullYear())}).length;
 var due=[];D.needs.forEach(function(n){if(!n.done&&n.due){var c=byId(n.contact_id);if(c&&c.stage!=='lost'&&c.stage!=='done'&&days(n.due)<=7)due.push({n:n,c:c})}});
 due.sort(function(a,b){return a.n.due<b.n.due?-1:1});
 var dbl=dblDates();var dk=Object.keys(dbl);
 var subs=D.plans.filter(function(p){return p.submitted_at&&days(p.submitted_at.slice(0,10))!==null&&days(p.submitted_at.slice(0,10))>=-14}).map(function(p){return {p:p,c:byId(p.contact_id)}}).filter(function(x){return x.c}).sort(function(a,b){return a.p.submitted_at<b.p.submitted_at?1:-1});
 return head(g+', Cade',new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),searchBox())+
 '<div class="tiles">'+
  tile(nw.length,'New inquiries','pipe')+tile(waiting.length,'Waiting on clients','wait')+tile(up.length,'Events in 30 days','cal')+tile(booked,'Events this year','all')+'</div>'+
 (dk.length?'<div class="sec"><h2>Double-booked</h2><div class="list">'+dk.map(function(k){return '<div class="row" style="cursor:default"><div class="grow"><b>'+fmt(k,true)+'</b><span>'+dbl[k].map(function(i){return esc(byId(i).name)}).join(' and ')+' are both booked</span></div></div>'}).join('')+'</div></div>':'')+
 (subs.length?'<div class="sec"><h2>Planning forms from couples</h2><div class="list">'+subs.map(function(x){return rowHtml(x.c,'<span style="color:var(--mu);font-size:13px">sent '+ago(x.p.submitted_at)+'</span>')}).join('')+'</div></div>':'')+
 todayExtras()+
 '<div class="sec"><h2>New inquiries</h2><div class="list">'+(nw.length?nw.map(function(c){return rowHtml(c,'<span style="color:var(--mu2);font-size:12px">'+ago(c.created_at)+'</span>')}).join(''):'<div class="empty">No new inquiries</div>')+'</div></div>'+
 '<div class="sec"><h2>Due this week</h2><div class="list">'+(due.length?due.slice(0,8).map(function(x){return '<button class="row" data-open="'+x.c.id+'"><div class="av">'+esc(ini(x.c.name))+'</div><div class="grow"><b>'+esc(x.n.label)+'</b><span>'+esc(x.c.name)+'</span></div><span class="chip'+(days(x.n.due)<0?' w':'')+'">'+rel(x.n.due)+'</span></button>'}).join(''):'<div class="empty">Nothing due in the next 7 days</div>')+'</div></div>'+
 '<div class="sec"><h2>Next events</h2><div class="list">'+(up.length?up.map(function(c){return rowHtml(c,'<span style="color:var(--mu);font-size:13px">'+fmt(c.event_date)+' · '+rel(c.event_date)+'</span>')}).join(''):'<div class="empty">No booked events in the next 30 days</div>')+'</div></div>';

function tile(n,l,v){return '<button class="tile" data-v="'+v+'" style="text-align:left"><div class="n h">'+n+'</div><div class="l">'+l+'</div></button>'}

function vPipe(){
 var cols=ST.filter(function(s){return s!=='lost'||showLost});
 var html=head('Pipeline',D.contacts.filter(function(c){return c.stage!=='lost'&&c.stage!=='done'}).length+' in progress',searchBox()+'<button class="pill'+(showLost?' on':'')+'" id="tl">Show lost</button>')+'<div class="board">';
 cols.forEach(function(s){
  var cs=D.contacts.filter(function(c){return c.stage===s&&match(c)});
  html+='<div class="col" data-stage="'+s+'"><h3><span>'+STL[s]+'</span><span>'+cs.length+'</span></h3>'+cs.map(function(c){
   var p=prog(c.id);
   return '<div class="card" draggable="true" data-open="'+c.id+'" data-id="'+c.id+'"><b>'+esc(c.name)+(c.paid?' <span class="chip w" style="margin-left:6px">Paid</span>':'')+'</b><div class="m">'+esc([c.service,c.event_date?fmt(c.event_date):''].filter(Boolean).join(' · '))+'</div><div class="f">'+(p.t?'<div class="bar" style="flex:1"><i style="width:'+p.p+'%"></i></div><span>'+p.d+'/'+p.t+'</span>':'<span>No checklist</span>')+'</div></div>';
  }).join('')+'</div>';
 });
 return html+'</div>';
}

function vWait(){
 var list=D.contacts.filter(function(c){return ACTIVE.indexOf(c.stage)>-1&&openNeeds(c.id).length&&match(c)});
 list.sort(function(a,b){var an=openNeeds(a.id).filter(function(n){return n.due}).map(function(n){return n.due}).sort()[0]||'9999',bn=openNeeds(b.id).filter(function(n){return n.due}).map(function(n){return n.due}).sort()[0]||'9999';return an<bn?-1:1});
 return head('Waiting on','What I still need from each customer',searchBox())+
 (list.length?list.map(function(c){
  var o=openNeeds(c.id);
  return '<div class="wcard"><header data-open="'+c.id+'"><div class="av">'+esc(ini(c.name))+'</div><div class="grow"><b>'+esc(c.name)+'</b><span>'+esc(c.service||'')+(c.event_date?' · '+fmt(c.event_date,true):'')+'</span></div><span class="chip">'+STL[c.stage]+'</span></header>'+
  o.map(function(n){return '<div class="wi"><button class="box" data-tog="'+n.id+'" aria-label="Mark done">'+ICO.chk+'</button><span>'+esc(n.label)+'</span>'+(n.due?'<span class="d'+(days(n.due)<0?' od':'')+'">'+fmt(n.due)+'</span>':'')+'</div>'}).join('')+
  '<div style="margin-top:12px"><button class="btn ghost sm" data-nudge="'+c.id+'">Email a reminder</button></div></div>';
 }).join(''):'<div class="empty">You are all caught up. Nothing outstanding from any active customer.</div>');
}

function vCal(){
 var y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
 var dbl=dblDates(),map={};
 D.contacts.forEach(function(c){if(c.event_date&&c.stage!=='lost')(map[c.event_date]=map[c.event_date]||[]).push(c)});
 var h=head('Calendar','',''),g='';
 ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(function(d){g+='<div class="dow">'+d+'</div>'});
 for(var i=0;i<42;i++){var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d);
  g+='<div class="day'+(d.getMonth()!==m?' off':'')+(k===iso(today())?' td':'')+'">'+d.getDate()+(map[k]||[]).map(function(c){var bk=c.stage==='booked'||c.stage==='planning'||c.stage==='done';return '<button class="ev'+(bk?'':' q')+(dbl[k]?' dbl':'')+'" data-open="'+c.id+'">'+esc(c.name)+'</button>'}).join('')+'</div>';}
 var up=D.contacts.filter(function(c){return c.event_date&&days(c.event_date)>=0&&c.stage!=='lost'}).sort(function(a,b){return a.event_date<b.event_date?-1:1}).slice(0,12);
 return h+'<div class="calwrap"><div class="cal"><div class="calh"><div class="h">'+calM.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</div><div style="display:flex;gap:8px"><button class="ib" id="cp">'+ICO.l+'</button><button class="pill" id="ct">Today</button><button class="ib" id="cn">'+ICO.r+'</button></div></div><div class="grid7">'+g+'</div><div style="margin-top:12px;color:var(--mu2);font-size:12px">Solid = booked · Outlined = not booked yet · Ringed = double-booked</div></div>'+
 '<div class="sec"><h2>Upcoming</h2><div class="list">'+(up.length?up.map(function(c){return '<button class="row" data-open="'+c.id+'"><div class="grow"><b>'+esc(c.name)+'</b><span>'+fmt(c.event_date,true)+' · '+STL[c.stage]+'</span></div></button>'}).join(''):'<div class="empty">No upcoming events</div>')+'</div></div></div>';
}

function vAll(){
 var list=D.contacts.filter(function(c){return (filt==='all'||c.stage===filt)&&match(c)});
 return head('Customers',D.contacts.length+' total',searchBox()+'<button class="btn ghost sm" id="csv">Export CSV</button><button class="btn ghost sm" id="bkp">Backup</button>')+
 '<div class="filters">'+['all'].concat(ST).map(function(s){return '<button class="pill'+(filt===s?' on':'')+'" data-f="'+s+'">'+(s==='all'?'All':STL[s])+'</button>'}).join('')+'</div>'+
 (list.length?'<div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Service</th><th>Event</th><th>Paid</th><th class="hm">Checklist</th><th>Stage</th></tr></thead><tbody>'+list.map(function(c){var p=prog(c.id);return '<tr class="r" data-open="'+c.id+'"><td><b>'+esc(c.name)+'</b><div style="color:var(--mu);font-size:13px">'+esc(c.email||'')+'</div></td><td>'+esc(c.service||'')+'</td><td>'+(c.event_date?fmt(c.event_date):'')+'</td><td>'+(c.paid?'<span class="chip w">Paid</span>':'')+'</td><td class="hm">'+(p.t?p.d+'/'+p.t:'')+'</td><td><span class="chip">'+STL[c.stage]+'</span></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">No customers match</div>');
}

/* ---------- bind view events ---------- */
function bind(){
 var s=$('#q');if(s){s.addEventListener('input',function(){q=s.value;var pos=s.selectionStart;render();var n=$('#q');n.focus();n.setSelectionRange(pos,pos)})}
 var tl=$('#tl');if(tl)tl.addEventListener('click',function(){showLost=!showLost;render()});
 var cp=$('#cp');if(cp){cp.onclick=function(){calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);render()};$('#cn').onclick=function(){calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);render()};$('#ct').onclick=function(){calM=new Date();render()}}
 document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){filt=b.dataset.f;render()}});
 var csv=$('#csv');if(csv)csv.onclick=exportCsv;
 // drag and drop
 document.querySelectorAll('.card[draggable]').forEach(function(c){
  c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag')});
  c.addEventListener('dragend',function(){c.classList.remove('drag')});
 });
 document.querySelectorAll('.col').forEach(function(col){
  col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('over')});
  col.addEventListener('dragleave',function(){col.classList.remove('over')});
  col.addEventListener('drop',function(e){e.preventDefault();col.classList.remove('over');var id=e.dataTransfer.getData('text/plain');if(id)setStage(id,col.dataset.stage)});
 });
}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-tog]');
 if(t){e.stopPropagation();toggleNeed(t.dataset.tog);return}
 var n=e.target.closest('[data-nudge]');
 if(n){e.stopPropagation();nudge(n.dataset.nudge);return}
 var pd_=e.target.closest('[data-paid]');if(pd_){togglePaid(pd_.dataset.paid);return}
 var pb=e.target.closest('[data-plan]');if(pb){openPlan(pb.dataset.plan);return}
 var mg=e.target.closest('[data-msg]');if(mg){openMsg(mg.dataset.msg);return}
 var sh=e.target.closest('[data-sheet]');if(sh){openSheet(sh.dataset.sheet);return}
 var ph=e.target.closest('[data-photo]');if(ph){togglePhoto(ph.dataset.photo);return}
 var bk=e.target.closest('#bkp');if(bk){backup();return}
 var ml=e.target.closest('[data-mklink]');if(ml){mkLink(ml.dataset.mklink);return}
 var cl=e.target.closest('[data-copylink]');if(cl){copyLink(cl.dataset.copylink);return}
 var ma=e.target.closest('[data-maillink]');if(ma){mailLink(ma.dataset.maillink);return}
 var ol=e.target.closest('[data-offlink]');if(ol){offLink(ol.dataset.offlink);return}
 if(e.target.closest('[data-new]')){newCustomer();return}
 var o=e.target.closest('[data-open]');
 if(o&&!e.target.closest('#drawer'))openDrawer(o.dataset.open);
});

/* ---------- mutations ---------- */

/* ---------- planning form ---------- */
function planRow(id){return D.plans.filter(function(p){return p.contact_id===id})[0]}
function planOf(id){var r=planRow(id);try{return r?JSON.parse(r.data||'{}'):{}}catch(e){return {}}}
function planPct(c){var p=planOf(c.id);if(!p.venue1&&c.venue)p.venue1=c.venue;return PlanForm.pct(function(k){return p[k]})}
var planId=null,pend={},ptimer=null,pform=null,saveSeq=0,polling=null,liveFlash=0;
function setSave(t){var e=$('#plsave');if(e)e.textContent=t}
function planSet(k,v){
 var c=byId(planId);if(!c)return;pend[k]=v;saveSeq++;setSave('Saving...');
 var row=planRow(c.id);if(!row){row={contact_id:c.id,data:'{}'};D.plans.push(row)}
 var o={};try{o=JSON.parse(row.data||'{}')}catch(e){}if(v)o[k]=v;else delete o[k];row.data=JSON.stringify(o);
 var pc=$('#plpct');if(pc)pc.textContent=planPct(c)+'% filled out';
 clearTimeout(ptimer);ptimer=setTimeout(flushPlan,700);
}
function openPlan(id){
 planId=id;pend={};var c=byId(id);if(!c)return;
 var pl=$('#planner');
 pl.innerHTML='<div class="pl"><div class="plbar"><button class="ib" id="plx" aria-label="Close">'+ICO.l+'</button><div class="grow"><b>'+esc(c.name)+'</b><span id="plpct" style="color:var(--mu);font-size:13px">'+planPct(c)+'% filled out</span><span class="live" id="pllive"><i></i><em>Live</em></span></div><span class="plsave" id="plsave"></span><button class="btn ghost sm" id="plprint">Print / PDF</button></div><div id="plform"></div></div>';
 $('#plx').onclick=closePlan;
 $('#plprint').onclick=function(){window.print()};
 pform=PlanForm.mount($('#plform'),{mode:'crm',topOffset:'68px',scroller:pl,scrollPad:68,scrollTo:true,
  get:function(k){var p=planOf(id);return k==='venue1'&&!p.venue1?(c.venue||''):p[k]},set:planSet});
 pl.classList.add('on');pl.setAttribute('aria-hidden','false');pl.scrollTop=0;closeDrawerSoft();
 clearInterval(polling);polling=setInterval(pollPlan,3000);
}
function closePlan(){var id=planId;clearInterval(polling);flushPlan().then(function(){planId=null;pform=null;$('#planner').classList.remove('on');$('#planner').setAttribute('aria-hidden','true');return load()}).then(function(){if(id)openDrawer(id)})}
function closeDrawerSoft(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')}
var chain=Promise.resolve();
function flushPlan(){
 clearTimeout(ptimer);var id=planId;if(!id||!Object.keys(pend).length)return chain;var batch=pend;pend={};
 chain=chain.then(function(){return api('PATCH','contacts/'+id+'/plan',{data:batch})}).then(function(r){setSave('Saved');if(r&&r.auto&&r.auto.length)toast('Checked off: '+r.auto.join(', '))})
 .catch(function(e){setSave('Not saved');toast(e.message);Object.keys(batch).forEach(function(k){if(pend[k]===undefined)pend[k]=batch[k]})});
 return chain;
}

function pollPlan(){
 var id=planId;if(!id||document.hidden||!pform)return;
 var seq=saveSeq;
 api('GET','contacts/'+id+'/plan').then(function(r){
  if(planId!==id||seq!==saveSeq||Object.keys(pend).length)return;
  var row=planRow(id);if(!row){row={contact_id:id,data:'{}'};D.plans.push(row)}
  var before=row.data;row.data=JSON.stringify(r.data||{});row.updated_at=r.updated_at;row.updated_by=r.updated_by;row.submitted_at=r.submitted_at;
  var n=pform.sync();
  var c=byId(id),pc=$('#plpct');if(c&&pc)pc.textContent=planPct(c)+'% filled out';
  var lv=$('#pllive');if(!lv)return;
  if(n)liveFlash=Date.now();
  var recent=r.updated_at&&(Date.now()-new Date(r.updated_at))<25000&&r.updated_by==='couple';
  lv.classList.toggle('hot',recent||Date.now()-liveFlash<6000);
  lv.querySelector('em').textContent=recent?'Couple is filling this out':(Date.now()-liveFlash<6000?'Just updated':'Live');
 }).catch(function(){});
}

var GEAR={
 wedding:['Main speakers','Subwoofer','Speaker stands','DJ controller and laptop','Backup laptop or phone playlist','Wireless mic for ceremony','Wireless mic for toasts','Lights and stands','Power strips and extension cords','Cables and adapters','Gaffer tape','DJ table and cloth','Cart or dolly','Business cards'],
 event:['Main speakers','Subwoofer','Speaker stands','DJ controller and laptop','Backup laptop or phone playlist','Wireless mics','Lights and stands','Power strips and extension cords','Cables and adapters','Gaffer tape','DJ table','Cart or dolly'],
 church:['Laptop and audio interface','XLR and instrument cables','Adapters and DI boxes','Measurement mic','Tools','Walkthrough notes','Proposal copy','Camera for room photos'],
 training:['Laptop','Demo mics and cables','Handouts','Sign-in sheet','Phone charger and power strip'],
 other:['Laptop','Cables and adapters','Power strips']

function lst(p,k){try{var a=JSON.parse(p[k]||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function songLine(p,k){return [p[k+'_t'],p[k+'_a']].filter(Boolean).join(' - ')}
function partyLine(p,k){var n=p[k+'_n'],s=[p[k+'_t'],p[k+'_a']].filter(Boolean).join(' - ');return [n,s].filter(Boolean).join(' · ')}
function personLine(p,k){return [p[k+'_n'],p[k+'_p']].filter(Boolean).join(' · ')}
function sheetHTML(c){
 var p=planOf(c.id),ven=[p.venue1||c.venue,p.venue2].filter(Boolean).join(' → ');
 var TL=[['setup_time','DJ set-up',''],['cer_time','Ceremony',[songLine(p,'pro')&&'Processional: '+songLine(p,'pro'),songLine(p,'ent')&&'Bride entrance: '+songLine(p,'ent'),songLine(p,'rec')&&'Recessional: '+songLine(p,'rec')].filter(Boolean).join('\n')],
  ['cocktail_time','Cocktail hour',[p.cocktail_len,p.cocktail_loc].filter(Boolean).join(' · ')],['intro_time','Grand entrance',p.welcome_by?'Welcome by '+p.welcome_by:''],
  ['dinner_time','Dinner',[p.dinner_style,p.blessing&&'Blessing: '+p.blessing].filter(Boolean).join(' · ')],['cake_time','Cake cutting',songLine(p,'cake')],['so_time','Send-off',[p.so_style,p.so_loc,songLine(p,'so')].filter(Boolean).join(' · ')]]
  .filter(function(r){return p[r[0]]}).sort(function(a,b){return p[a[0]]<p[b[0]]?-1:1});
 function sec(t,rows){rows=rows.filter(function(r){return r[1]});return rows.length?'<div class="sh"><h3>'+esc(t)+'</h3>'+rows.map(function(r){return '<div class="sr"><span>'+esc(r[0])+'</span><div>'+esc(r[1])+'</div></div>'}).join('')+'</div>':''}
 function songs(k){return lst(p,k).map(function(r,i){return (i+1)+'. '+[r.t,r.a].filter(Boolean).join(' - ')}).join('\n')}
 var trads=[['bouquet','Bouquet toss'],['garter','Garter toss'],['dollar','Dollar dance'],['cultural','Cultural'],['games','Games'],['other','Other']].map(function(t){var on=p['t_'+t[0]+'_on'];return on||p['t_'+t[0]+'_d']?[t[1],[on==='yes'?'Yes':on==='no'?'No':'',p['t_'+t[0]+'_d']].filter(Boolean).join(' · ')]:['','']});
 var gear=GEAR[skey(c.service)]||GEAR.other,done=lst(p,'gear_list');
 var h='<div class="shi"><div class="shbar"><button class="ib" id="shx" aria-label="Close">'+ICO.l+'</button><div class="grow"><b>Event sheet</b></div><button class="btn ghost sm" id="shp">Print / PDF</button></div>'+
 '<h1 class="h shn">'+esc(c.name)+'</h1><div class="shm">'+[c.event_date&&fmt(c.event_date,true),c.service,p.guests&&p.guests+' guests'].filter(Boolean).map(function(x){return '<i>'+esc(x)+'</i>'}).join('')+'</div>'+
 sec('Where',[['Venue',ven],['Phone',c.phone],['Email',c.email]])+
 (TL.length?'<div class="sh"><h3>Timeline</h3>'+TL.map(function(r){return '<div class="sr tl"><span>'+esc(fmtT(p[r[0]]))+'</span><div><b>'+esc(r[1])+'</b>'+(r[2]?'<div class="sd">'+esc(r[2])+'</div>':'')+'</div></div>'}).join('')+'</div>':'<div class="sh"><h3>Timeline</h3><div class="sr"><div style="color:var(--mu2)">No times filled in yet.</div></div></div>')+
 sec('People',[['Couple',p.couple_phone],['Day-of contact',personLine(p,'dayof')],['Officiant',personLine(p,'officiant')],['Photo / video',personLine(p,'photovideo')]])+
 sec('Ceremony',[['Prelude',p.prelude],['Music / readings',p.readings],['Mics and audio',p.cer_mics],['Weather plan',p.weather]])+
 sec('Introductions',[['Parents / family',partyLine(p,'intro_parents')],['Ring bearer / flower girl',partyLine(p,'intro_ring')],['Wedding party',partyLine(p,'intro_party')],['Best man / MOH',partyLine(p,'intro_honor')],['Bride and groom',partyLine(p,'intro_bg')]])+
 sec('Toasts and dinner',[['Best man',p.toast_bm],['Maid of honor',p.toast_moh],['More speakers',p.toast_more],['Thank-you',p.thanks],['Dismissal',p.dismissal],['Allergies',p.allergies],['Announcements',[p.cocktail_ann,p.dinner_ann].filter(Boolean).join('\n')]])+
 sec('Dances',[['First dance',songLine(p,'dance_bg')],['Parent dance',partyLine(p,'dance_p1')],['Parent dance 2',partyLine(p,'dance_p2')],['Another dance',partyLine(p,'dance_x')],['Dessert',p.dessert]])+
 sec('Traditions',trads)+
 sec('Music',[['Crowd',p.genres],['Clean only?',p.clean],['Group dances',p.group_ok],['Vibe',p.vibe],['Last song',songLine(p,'last')],['Playlist',p.playlist_link],['Cocktail music',songs('cocktail_list')],['Dinner music',songs('dinner_list')],['Must play',songs('must_list')],['Do NOT play',songs('dont_list')]])+
 sec('Notes',[['Notes',p.notes],['Their message',c.message]])+
 '<div class="sh noprint"><h3>Gear and load-in</h3>'+gear.map(function(g,i){return '<label class="gr"><input type="checkbox" data-gear="'+esc(g)+'"'+(done.indexOf(g)>-1?' checked':'')+'><span>'+esc(g)+'</span></label>'}).join('')+'</div></div>';
 return h;
}
function openSheet(id){
 var c=byId(id);if(!c)return;
 var s=document.getElementById('sheet');if(!s){s=document.createElement('div');s.id='sheet';document.body.appendChild(s)}
 s.innerHTML=sheetHTML(c);s.classList.add('on');s.scrollTop=0;closeDrawerSoft();
 s.querySelector('#shx').onclick=function(){s.classList.remove('on');openDrawer(id)};
 s.querySelector('#shp').onclick=function(){window.print()};
 s.querySelectorAll('[data-gear]').forEach(function(b){b.onchange=function(){var p=planOf(id),a=lst(p,'gear_list'),g=b.dataset.gear,i=a.indexOf(g);if(b.checked&&i<0)a.push(g);if(!b.checked&&i>-1)a.splice(i,1);var v=a.length?JSON.stringify(a):'';var row=planRow(id);if(!row){row={contact_id:id,data:'{}'};D.plans.push(row)}var o=planOf(id);if(v)o.gear_list=v;else delete o.gear_list;row.data=JSON.stringify(o);api('PATCH','contacts/'+id+'/plan',{data:{gear_list:v}}).catch(function(e){toast(e.message)})}});
}
function togglePhoto(id){var p=planOf(id),v=p.photo_ok==='yes'?'':'yes';var row=planRow(id);if(!row){row={contact_id:id,data:'{}'};D.plans.push(row)}var o=planOf(id);if(v)o.photo_ok=v;else delete o.photo_ok;row.data=JSON.stringify(o);drawerRefresh(true);api('PATCH','contacts/'+id+'/plan',{data:{photo_ok:v}}).catch(function(e){toast(e.message);load()})}

var SRC=['website','instagram','facebook','referral','calendly','repeat client','other'];
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):'Unknown'}
function bookedAt(c){var t=null;D.notes.forEach(function(n){if(n.contact_id===c.id&&/→ booked$/.test(n.text||'')){var x=new Date(n.created_at).getTime();if(t===null||x<t)t=x}});return t}
function vStats(){
 var yr=Date.now()-365*864e5,rec=D.contacts.filter(function(c){return new Date(c.created_at).getTime()>=yr});
 var won=rec.filter(function(c){return ['booked','planning','done'].indexOf(c.stage)>-1}),lost=rec.filter(function(c){return c.stage==='lost'}).length;
 var gaps=[];won.forEach(function(c){var b=bookedAt(c);if(b){var d=(b-new Date(c.created_at).getTime())/864e5;if(d>=0)gaps.push(d)}});
 var avg=gaps.length?Math.round(gaps.reduce(function(a,b){return a+b},0)/gaps.length):null;
 var by={};rec.forEach(function(c){var s=c.source||'unknown';var o=by[s]=by[s]||{n:0,w:0};o.n++;if(['booked','planning','done'].indexOf(c.stage)>-1)o.w++});
 var mo=[];for(var i=5;i>=0;i--){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');mo.push({k:k,l:d.toLocaleDateString('en-US',{month:'short'}),n:D.contacts.filter(function(c){return (c.created_at||'').slice(0,7)===k}).length})}
 var mx=Math.max.apply(null,mo.map(function(x){return x.n}).concat([1]));
 var nowD=new Date(),nm=(nowD.getMonth()+1)%12+1;
 var ann=D.contacts.filter(function(c){if(!c.event_date||c.stage==='lost')return false;var y=+c.event_date.slice(0,4),m=+c.event_date.slice(5,7);return y<nowD.getFullYear()&&(m===nowD.getMonth()+1||m===nm)}).sort(function(a,b){return a.event_date.slice(5)<b.event_date.slice(5)?-1:1});
 var past=D.contacts.filter(function(c){return c.stage==='done'}).length;
 return head('Stats','Last 12 months',searchBox().replace(/.*/,'')+'<button class="btn ghost sm" id="bkp">Download backup</button>')+
 '<div class="tiles">'+tile(rec.length,'Inquiries','all')+tile(won.length,'Booked','all')+tile(rec.length?Math.round(won.length/rec.length*100)+'%':'-','Booked rate','all')+tile(avg===null?'-':avg+'d','Avg days to book','all')+'</div>'+
 '<div class="sec"><h2>Inquiries by month</h2><div class="bars">'+mo.map(function(x){return '<div class="bc"><div class="bv" style="height:'+Math.round(x.n/mx*100)+'%"><em>'+x.n+'</em></div><span>'+x.l+'</span></div>'}).join('')+'</div></div>'+
 '<div class="sec"><h2>Where leads come from</h2><div class="list">'+(Object.keys(by).length?Object.keys(by).sort(function(a,b){return by[b].n-by[a].n}).map(function(s){return '<div class="row" style="cursor:default"><div class="grow"><b>'+esc(cap(s))+'</b><span>'+by[s].w+' booked</span></div><span class="chip">'+by[s].n+(by[s].n===1?' inquiry':' inquiries')+'</span></div>'}).join(''):'<div class="empty">No data yet</div>')+'</div></div>'+
 '<div class="sec"><h2>Anniversaries this month and next</h2><div class="list">'+(ann.length?ann.map(function(c){return rowHtml(c,'<span style="color:var(--mu);font-size:13px">'+fmt(c.event_date.slice(0,4)===''?c.event_date:(nowD.getFullYear()+c.event_date.slice(4)))+' · '+(nowD.getFullYear()-(+c.event_date.slice(0,4)))+' yr</span>')}).join(''):'<div class="empty">None coming up</div>')+'</div></div>'+
 '<div class="sec"><h2>Past clients</h2><div class="empty" style="border-style:solid">'+past+' completed events on file. Lost leads: '+lost+'.</div></div>';
}
function backup(){var o={exported:new Date().toISOString(),contacts:D.contacts,needs:D.needs,notes:D.notes,plans:D.plans.map(function(p){return {contact_id:p.contact_id,data:p.data,submitted_at:p.submitted_at,updated_at:p.updated_at}})};
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='devo-crm-backup-'+iso(new Date())+'.json';a.click();toast('Backup downloaded')}
function todayExtras(){
 var fu=D.contacts.filter(function(c){return ['new','contacted','quoted'].indexOf(c.stage)>-1&&quietDays(c)>=3}).sort(function(a,b){return lastTouch(a)-lastTouch(b)});
 var rv=D.contacts.filter(function(c){var d=days(c.event_date);return d!==null&&d<0&&d>=-21&&c.stage!=='lost'&&['booked','planning','done'].indexOf(c.stage)>-1&&!D.notes.some(function(n){return n.contact_id===c.id&&/^Opened a review request/.test(n.text||'')})});

  (rv.length?'<div class="sec"><h2>Ask for a review</h2><div class="list">'+rv.map(function(c){return rowHtml(c,'<span style="color:var(--mu);font-size:13px">'+fmt(c.event_date)+'</span>')}).join('')+'</div></div>':'');
